
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppCifar10</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename = 'ai_logo.png') }}">

    <style>
    :root{
      --bg1: #0f172a;
      --bg2: #071032;
      --card: rgba(255,255,255,0.06);
      --accent: #7c5cff;
      --accent-2: #00d4ff;
      --glass: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.7);
      --radius: 14px;
      --shadow: 0 8px 30px rgba(2,6,23,0.6);
      --glass-border: rgba(255,255,255,0.06);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100vh;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,92,255,0.12), transparent),
                  radial-gradient(900px 400px at 90% 90%, rgba(0,212,255,0.06), transparent),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:#e8eef7;
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px;
    }

    .app-container{
      width:1100px;
      max-width:calc(100% - 64px);
      display:grid;
      grid-template-columns: 420px 1fr;
      gap:28px;
      align-items:start;
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding:28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px) saturate(120%);
      min-height:320px;
    }

    
    .upload-panel .brand{
      font-size:20px;
      letter-spacing:0.6px;
      margin-bottom:18px;
      color: #fff;
      background: linear-gradient(90deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .file-drop{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      flex-direction:column;
      padding:28px;
      border-radius:12px;
      cursor:pointer;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px dashed rgba(255,255,255,0.06);
      transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      text-align:center;
      min-height:160px;
    }

    .file-drop:hover{ transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,0,0,0.5); border-color: rgba(124,92,255,0.6);}

    .file-drop input[type="file"]{ display:none; }
    .file-text{ color:var(--muted); font-size:14px; }

    .actions{ margin-top:18px; display:flex; gap:12px; align-items:center; }
    .btn{
      border:0; padding:10px 16px; border-radius:10px; font-weight:600; cursor:pointer; color:#082033;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      box-shadow: 0 6px 18px rgba(124,92,255,0.12);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover{ transform:translateY(-3px); box-shadow: 0 14px 32px rgba(124,92,255,0.12); }
    .btn.primary{ color:#fff; }

    .result-title{
      font-size:18px;
      margin-bottom:14px;
      color:#f1f5ff;
    }

    .results-box{
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));
      border-radius:12px;
      padding:18px;
      min-height:240px;
      border:1px solid rgba(255,255,255,0.04);
      color: #e6eefc;
      overflow:auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .results-box .placeholder{
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      color:rgba(255,255,255,0.5);
      font-size:15px;
    }

    
    @media (max-width:980px){
      .app-container{ grid-template-columns: 1fr; }
      .upload-panel{ order:1 }
      .result-panel{ order:2; margin-top:12px }
    }
    </style>
</head>
<body>
    <main class="app-container">
        <section class="panel upload-panel">
            <h1 class="brand">Image Reply</h1>
            <form id="uploadForm" action="/result" method="post" enctype="multipart/form-data">
                <label class="file-drop" for="fileInput">
                    <input id="fileInput" name="image" type="file" accept="image/*" />
                    <span class="file-text">Click or drag an image here</span>
                </label>

                <div class="actions">
                    <button class="btn primary" type="submit">Send to Backend</button>
                </div>
            </form>
            <p class="hint">Supported: JPG, PNG, GIF — files are sent to the backend for analysis.</p>
        </section>

        <section class="panel result-panel">
            <form action="/result" method = 'POST'>
                <h2 class="result-title">Result: {{ rslt }}</h2>
                <div id="results" class="results-box">
                    <div class="placeholder">{{ txt }}</div>
                    {% if image_path %}
                    <div style="margin-top: 20; margin-left: 10px; display: flex; align-items: center; justify-content: center;">
                        <img style="border-radius: 30px; margin-top: 20px;" src="{{ image_path }}" width = '250' height='auto'">
                    </div>
                    {% endif %}
                </div>
            </form>
            
        </section>
    </main>
</body>
</html>
